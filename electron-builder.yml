appId: com.aos.data-client
productName: Data Client
copyright: Copyright © 2026 AOS
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - resources/icon.png
  - resources/icon.ico
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
  signAndEditExecutable: false
  icon: icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Data Client
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
npmRebuild: false
